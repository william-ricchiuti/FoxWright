<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Foxwright needs your OK</title>
  <link rel="stylesheet" href="../popup/popup.css">
  <link rel="stylesheet" href="prompt.css">
</head>
<body class="prompt">
  <header>
    <div class="hanko" aria-hidden="true">狐</div>
    <div class="title">
      <h1 id="title">Let Foxwright use this site?</h1>
      <p id="subtitle">An AI agent connected through Foxwright is asking.</p>
    </div>
  </header>
  <section class="card">
    <p id="body"></p>
    <p class="origin"><code id="origin"></code></p>
    <ul id="files" hidden></ul>
    <p class="fine" id="tabline"></p>
  </section>
  <div class="actions">
    <!-- disabled until prompt.js has shown the request and the window has been on screen for a moment -->
    <button id="deny" disabled>Deny</button>
    <button id="always" disabled>Always allow</button>
    <button id="once" class="primary" disabled>Allow this session</button>
  </div>
  <p class="fine note">This window belongs to the Foxwright extension. Web pages and the AI can't press these buttons. You can revoke sites any time from the Foxwright toolbar button.</p>
  <script src="prompt.js"></script>
</body>
</html>
