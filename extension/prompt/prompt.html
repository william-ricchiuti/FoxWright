<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Foxwright needs your OK</title>
  <link rel="stylesheet" href="../popup/popup.css">
  <link rel="stylesheet" href="prompt.css">
</head>
<body class="prompt">
  <header>
    <div class="hanko" aria-hidden="true">狐</div>
    <div class="title">
      <h1 id="title">Let Foxwright use this site?</h1>
      <p id="subtitle">An AI agent connected through Foxwright is asking.</p>
    </div>
  </header>
  <section class="card">
    <p id="body"></p>
    <p class="origin"><code id="origin"></code></p>
    <ul id="files" hidden></ul>
    <div id="element" hidden>
      <p id="elname"></p>
      <p class="fine" id="elreason"></p>
      <p class="fine" id="summary" hidden></p>
    </div>
    <p class="fine" id="tabline"></p>
  </section>
  <label class="readonly" id="readonly-row" hidden><input type="checkbox" id="readonly" disabled aria-describedby="readonly-help"> <span><b>Read only</b> <span id="readonly-help">· it can look, but not click or type</span></span></label>
  <div class="actions" role="group" aria-label="Your answer">
    <!-- disabled until prompt.js has shown the request and the window has been on screen for a moment -->
    <button id="deny" type="button" disabled>Deny</button>
    <button id="once" type="button" class="primary" disabled aria-describedby="once-help">Allow this session</button>
    <button id="hour" type="button" disabled>Allow for 1 hour</button>
    <button id="always" type="button" disabled>Always allow</button>
  </div>
  <p class="fine note"><span id="once-help">“This session” lasts until you quit Firefox. </span>Web pages and the AI can't press these buttons. Revoke sites any time from the Foxwright toolbar button.</p>
  <script src="prompt.js"></script>
</body>
</html>
