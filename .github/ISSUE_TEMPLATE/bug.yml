name: Bug report
description: Something in Kitsune doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For security problems, please don't open an issue: see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The site (URL), what you asked the agent, and the tool calls if you have them.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Kitsune version (toolbar popup) and helper version (`npx kitsune-firefox --version`)
    validations:
      required: true
  - type: input
    id: firefox
    attributes:
      label: Firefox version and how it's installed (e.g. 156, Mozilla .deb / Snap / Flatpak / macOS app / Windows installer)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux, Other]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Input mode (shown in the toolbar popup)
      options: [Synthetic events, Trusted (WebDriver BiDi), Not sure]
  - type: input
    id: client
    attributes:
      label: AI client (e.g. Claude Code 2.x, Claude Desktop)
  - type: textarea
    id: doctor
    attributes:
      label: Output of `npx kitsune-firefox doctor`
      render: text
