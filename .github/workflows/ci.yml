name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Linux · Firefox ${{ matrix.firefox }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # latest, and the oldest version the manifest allows (strict_min_version 152; earlier versions give MV3 extensions no tabs.captureTab)
        firefox: [latest, "152.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: ${{ matrix.firefox }}
      - name: Test host names and X11 tools for the gap suites
        run: |
          echo "127.0.0.1 a.test sub.a.test b.test c.test xn--pple-43d.test" | sudo tee -a /etc/hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool xauth
          echo "FIREFOX=$(readlink -f "$(command -v firefox)")" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix host
      - name: Versions agree
        run: node scripts/version.mjs check
      - name: BiDi client (fake Firefox, no browser needed)
        run: node test/bidi-connect.mjs
      - name: Cleanup of an install from before the rename
        run: node test/rename-cleanup.mjs
      - name: Build extension, helper and fixtures
        run: |
          npm run build
          node test/build-fixtures.mjs
      - name: Lint extension builds
        run: |
          npx web-ext lint --source-dir dist/store
          npx web-ext lint --source-dir dist/full
      # The tests set up their own copy of the helper in a temporary HOME (see test/harness.mjs).
      - name: End-to-end tests (synthetic input)
        run: node test/e2e.mjs
      - name: End-to-end tests (trusted input via WebDriver BiDi)
        run: FOXWRIGHT_E2E_TRUSTED=1 node test/e2e.mjs
      - name: Safety, permission, store-build and resilience tests
        run: node test/run-suites.mjs e2e-safety e2e-permissions e2e-store e2e-resilience e2e-multi
      - name: Store build in depth (no javascript_tool), both input modes
        run: |
          node test/e2e-storebuild.mjs
          FOXWRIGHT_E2E_TRUSTED=1 node test/e2e-storebuild.mjs
      # Headful under Xvfb (xdotool presses real keys). Known limits are reported as "~ known limit"
      # and don't fail the job; one that starts passing does (see KNOWN_LIMITS in test/gap-lib.mjs).
      - name: Gap suites (boundary, fuzz, hostile pages, persistence, secrets, Stop, trusted input)
        run: node test/run-suites.mjs gaps
      - name: Event page idle timeout
        if: matrix.firefox == 'latest'
        run: node test/e2e-idle.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.firefox }}
          path: test/results/

  node20:
    name: Linux · Node 20 · Firefox latest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - name: Install dependencies and build
        run: |
          echo "FIREFOX=$(readlink -f "$(command -v firefox)")" >> "$GITHUB_ENV"
          npm ci
          npm ci --prefix host
          npm run build
          node test/build-fixtures.mjs
      - name: BiDi client (fake Firefox)
        run: node test/bidi-connect.mjs
      - name: Suites on Node 20
        run: |
          node test/run-suites.mjs e2e e2e-safety e2e-permissions e2e-store e2e-storebuild e2e-resilience e2e-multi
          FOXWRIGHT_E2E_TRUSTED=1 node test/e2e.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-node20
          path: test/results/

  amo-signed:
    # The signed XPI addons.mozilla.org serves, when it is the version in this tree (otherwise the
    # job says so and skips). Non-blocking: AMO may lag behind, or be briefly unreachable.
    name: Signed AMO build · Firefox latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - name: Install dependencies and build the helper and fixtures
        run: |
          echo "FIREFOX=$(readlink -f "$(command -v firefox)")" >> "$GITHUB_ENV"
          npm ci
          npm ci --prefix host
          npm run build
          node test/build-fixtures.mjs
      - name: Download and unpack the signed XPI from AMO
        id: amo
        run: node test/fetch-amo-xpi.mjs dist/amo
      - name: Store-build suite against the signed XPI (synthetic, then trusted input)
        if: steps.amo.outputs.found == 'true'
        env:
          FOXWRIGHT_E2E_BUILD: dist/amo
        run: |
          node test/e2e-storebuild.mjs
          FOXWRIGHT_E2E_TRUSTED=1 node test/e2e-storebuild.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-amo-signed
          path: test/results/

  package:
    name: npm package installs and runs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build and pack the helper
        shell: bash
        run: |
          npm ci --prefix host
          npm run build --prefix host
          cd host && npm pack
      - name: Install the packed tarball and run setup + doctor
        shell: bash
        run: |
          npm install -g ./host/foxwright-firefox-*.tgz
          foxwright-firefox --version
          foxwright-firefox setup
          # doctor exits non-zero because no Firefox is running with the extension here;
          # it must still run and report the installed pieces.
          foxwright-firefox doctor | tee doctor.txt || true
          grep -qi "native" doctor.txt
          foxwright-firefox uninstall

  windows:
    # First real end-to-end runs on Windows (registry key, .bat launcher, named pipe). Non-blocking
    # until it has a track record. The runner is throwaway, so the tests use its real profile/HOME.
    name: Windows · end-to-end smoke
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        shell: bash # Git Bash: stops at the first failing command (pwsh would carry on)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - name: Locate Firefox
        shell: pwsh
        run: |
          $ff = (Get-Command firefox -ErrorAction SilentlyContinue).Source
          if (-not $ff) { $ff = "C:\Program Files\Mozilla Firefox\firefox.exe" }
          Write-Output "Firefox: $ff"
          & $ff --version | Out-Host
          "FIREFOX=$ff" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install dependencies and build
        run: |
          npm ci
          npm ci --prefix host
          npm run build
          node test/build-fixtures.mjs
      - name: Set up the helper (registry key, .bat launcher)
        run: node host/dist/foxwright.mjs setup
      - name: Smoke test (tabs, navigate, read_page, click, type, screenshot, doctor)
        run: node test/e2e-smoke.mjs
      - name: doctor after Firefox closed (expected to report Firefox not running)
        run: node host/dist/foxwright.mjs doctor || true
      - name: Full e2e suite (informational)
        continue-on-error: true
        run: node test/e2e.mjs
      - name: Helper log
        if: always()
        run: node -e "const f = require('path').join(require('os').homedir(), '.foxwright', 'helper.log'); try { console.log(require('fs').readFileSync(f, 'utf8').split('\n').slice(-100).join('\n')); } catch (e) { console.log(e.message); }"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-windows
          path: test/results/

  macos:
    # The suites on a macOS runner (real HOME is fine: the runner is throwaway). Non-blocking at first.
    name: macOS · e2e + safety
    runs-on: macos-latest
    timeout-minutes: 40
    continue-on-error: true
    env:
      # If setup-firefox falls back to the preinstalled /Applications/Firefox.app, the harness may
      # write its policies.json there: nobody's real browser on a CI runner.
      FOXWRIGHT_E2E_ALLOW_SYSTEM_FIREFOX: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - name: Locate Firefox, install dependencies, build, set up the helper
        run: |
          FF="$(command -v firefox || echo /Applications/Firefox.app/Contents/MacOS/firefox)"
          FF="$(node -e 'console.log(require("fs").realpathSync(process.argv[1]))' "$FF")"
          echo "Firefox: $FF"; "$FF" --version
          echo "FIREFOX=$FF" >> "$GITHUB_ENV"
          npm ci
          npm ci --prefix host
          npm run build
          node test/build-fixtures.mjs
          node host/dist/foxwright.mjs setup
      - name: e2e (synthetic, then trusted input) and safety
        run: |
          node test/run-suites.mjs e2e e2e-safety e2e-storebuild
          FOXWRIGHT_E2E_TRUSTED=1 node test/e2e.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-macos
          path: test/results/

  sandboxed-firefox:
    # Snap and Flatpak Firefox have never been tested. Expected to fail today (sandboxing keeps
    # Firefox from starting the helper); the job records the exact behaviour and errors so the
    # README's warning can be precise. Non-blocking.
    name: Linux · ${{ matrix.package }} Firefox (sandbox probe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        package: [snap, flatpak]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Build the extension and helper
        run: |
          npm ci
          npm ci --prefix host
          npm run build
      - name: Install the Snap
        if: matrix.package == 'snap'
        run: |
          sudo snap install firefox
          snap version
          snap connections firefox || true
          echo "FIREFOX=/snap/bin/firefox" >> "$GITHUB_ENV"
          # Snap Firefox reads enterprise policies from /etc/firefox/policies.
          sudo mkdir -p /etc/firefox/policies
          echo '{"policies":{"DisableAppUpdate":true,"3rdparty":{"Extensions":{"kitsune-full@william-ricchiuti.com":{"mode":"all"}}}}}' | sudo tee /etc/firefox/policies/policies.json
      - name: Install the Flatpak
        if: matrix.package == 'flatpak'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.mozilla.firefox
          flatpak info --user org.mozilla.firefox | head -20
          # setup writes the native-messaging manifest into the Flatpak's folder only if it exists.
          mkdir -p "$HOME/.var/app/org.mozilla.firefox/.mozilla"
          printf '#!/bin/sh\nexec flatpak run --user org.mozilla.firefox "$@"\n' > "$HOME/flatpak-firefox"
          chmod +x "$HOME/flatpak-firefox"
          echo "FIREFOX=$HOME/flatpak-firefox" >> "$GITHUB_ENV"
      - name: Set up the helper (real HOME on this throwaway runner)
        run: node host/dist/foxwright.mjs setup
      - name: Probe
        run: node test/sandbox-probe.mjs ${{ matrix.package }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sandbox-${{ matrix.package }}
          path: test/results/
