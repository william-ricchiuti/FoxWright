<!doctype html><html><head><meta charset="utf-8"><title>Sign in</title></head><body style="font-family:sans-serif">
<h1>Sign in</h1>
<form id="login" action="/log" method="get">
  <label>User <input id="user" name="user" value="ada" autocomplete="username"></label>
  <label>Password <input id="pw" name="pw" type="password" value="hunter2-attr" autocomplete="current-password"></label>
  <button type="button" id="show" onclick="const p = document.getElementById('pw'); p.type = p.type === 'password' ? 'text' : 'password'; this.textContent = p.type === 'password' ? 'Show password' : 'Hide password'">Show password</button>
  <label>PIN <input id="pin" name="pin" type="password"></label>
  <button id="go">Sign in</button>
</form>
<form id="login2"><label>Second password <input id="pw2" type="password" aria-label="Second password"></label></form>
<script>document.getElementById('pin').value = 's3cret-script-PIN';</script>
</body></html>
