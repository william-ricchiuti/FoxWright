<!doctype html><html><head><meta charset="utf-8"><title>Sign in (approved site)</title></head><body style="font-family:sans-serif">
<h1>Sign in</h1>
<!-- Enter in the field submits the form; the server redirects to another site (b.test), whose page autofocuses a field. -->
<form action="/redirect" method="get">
  <input type="hidden" name="to" value="http://b.test:8767/autofocus-sink.html">
  <label>User <input id="user" name="u" autocomplete="off"></label>
</form>
<p><label>Notes <textarea id="notes" rows="4" cols="40"></textarea></label></p>
</body></html>
