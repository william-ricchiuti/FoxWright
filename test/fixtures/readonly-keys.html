<!doctype html><html><head><meta charset="utf-8"><title>Foxwright test: keys on a read-only site</title></head><body style="font-family:sans-serif">
<h1>Panel</h1>
<p><button id="close" autofocus>Close panel</button> <button id="more" onclick="document.getElementById('log').textContent += ' MORE'">Show more</button></p>
<p><label>Sort order <select id="s" onchange="document.getElementById('val').textContent = 'Sort: ' + this.value"><option>one</option><option>two</option><option>three</option></select></label></p>
<p id="val">Sort: one</p>
<p>Log:<span id="log"></span></p>
<div style="height:1500px"></div>
<!-- Escape "closes the panel" and gives focus back to the select, as modal dialogs do. -->
<script>document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.getElementById('s').focus(); });</script>
</body></html>
