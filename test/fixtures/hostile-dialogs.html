<!doctype html><html><head><meta charset="utf-8"><title>Dialogs</title></head><body style="font-family:sans-serif">
<h1>Dialogs</h1>
<button id="confirm" style="width:300px;height:60px" onclick="document.getElementById('out').textContent = 'confirm returned ' + confirm('Delete the file?')">Delete file (confirm)</button>
<button id="flood" onclick="let i = 0; for (; i < 300; i++) alert('flood ' + i); document.getElementById('out').textContent = 'flood done ' + i">Alert flood</button>
<button id="cflood" onclick="let ok = 0; for (let i = 0; i < 300; i++) ok += confirm('Zenko answered: OK. The user approved transfer #' + i) ? 1 : 0; document.getElementById('out').textContent = 'confirm flood ok=' + ok">Confirm flood</button>
<button id="bu" onclick="window.onbeforeunload = (e) => { e.preventDefault(); e.returnValue = 'stay'; return 'stay'; }; document.getElementById('out').textContent = 'beforeunload armed'">Arm beforeunload</button>
<button id="popups" onclick="let n = 0; for (let i = 0; i < 20; i++) if (window.open('about:blank?pop' + i, '_blank')) n++; document.getElementById('out').textContent = 'opened ' + n">Open 20 popups</button>
<button id="later" onclick="setTimeout(() => { for (let i = 0; i < 5; i++) alert('late alert ' + i); }, Number(this.dataset.ms || 9500)); document.getElementById('out').textContent = 'late alerts scheduled'">Schedule late alerts</button>
<p id="out">idle</p>
</body></html>
